name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Update to Node 22 to remain fully compliant with Github Actions runners
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 2. Tell the pnpm setup action to match your local v11 structure precisely
      - name: Install pnpm
        uses: pnpm/action-setup@v4
       

      # 3. Dynamic lookup of the store directory to ensure correct caching paths
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # 4. Generate Prisma definitions right before building so compilation checks pass
      - name: Install dependencies
        run: |
           pnpm install --frozen-lockfile --ignore-scripts
           pnpm prisma generate
      - name: TypeScript compile check
        run: pnpm run build

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
